<div class="space-y-4">
  {% for t in terms %}
  <article class="rounded-xl border border-[#E4E1DA] bg-white p-4">
    <div class="flex items-baseline justify-between gap-2">
      <h3 class="font-serif text-sm font-bold text-[#161614]">{{ t.term_ko }}</h3>
      <span class="font-mono text-[10px] text-[#63615B]">{{ t.term_en }}</span>
    </div>
    <p class="mt-2 rounded-lg bg-[#FAF9F6] px-3 py-2 text-xs font-medium text-[#C85A32]">💡 {{ t.short_analogy }}</p>
    <p class="mt-2 text-xs leading-relaxed text-[#63615B]">{{ t.detail_markdown }}</p>
  </article>
  {% endfor %}
</div>
