<article class="rounded-2xl border border-[#E4E1DA] bg-white p-6 shadow-sm">
  <div class="flex items-center justify-between border-b border-[#E4E1DA] pb-3">
    <p class="text-xs font-semibold text-[#161614]">Q. {{ query }}</p>
    <span class="rounded-full bg-[#F2F0EB] px-2.5 py-0.5 font-mono text-[10px] text-[#63615B]">{{ answer.provider_used }}</span>
  </div>

  <div class="mt-4 whitespace-pre-line text-sm leading-relaxed text-[#161614]">{{ answer.answer_text }}</div>

  {% if !answer.citations.is_empty() %}
  <div class="mt-6 border-t border-[#E4E1DA] pt-4">
    <p class="font-mono text-[10px] uppercase tracking-[0.16em] text-[#1F5C6E]">RETRIEVED CITATIONS (RAG 근거)</p>
    <div class="mt-3 grid gap-3 sm:grid-cols-2">
      {% for c in answer.citations %}
      <div class="rounded-xl border border-[#E4E1DA] bg-[#FAF9F6] p-3 text-xs">
        <div class="flex items-center justify-between gap-2">
          <span class="font-semibold text-[#161614]">{{ c.brand }} {{ c.product_name }}</span>
          <span class="rounded-full px-2 py-0.5 text-[10px] {% if c.is_evergreen %}bg-[#5B4B8A]/10 text-[#5B4B8A]{% else %}bg-[#C85A32]/10 text-[#C85A32]{% endif %}">
            {{ c.policy_label }}
          </span>
        </div>
        <div class="mt-2 flex items-center justify-between text-[11px]">
          <button type="button" onclick="toggleCompareItem('{{ c.product_id }}', '{{ c.product_name }}')" class="font-semibold text-[#C85A32] hover:underline">+ 비교함 담기</button>
          <a href="{{ c.source_url }}" target="_blank" rel="noopener noreferrer" class="text-[#1F5C6E] underline underline-offset-2">공식 출처 ↗</a>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
  {% endif %}
</article>
