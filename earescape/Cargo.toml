[package]
name = "ear-escape"
version = "0.1.0"
edition = "2021"
description = "막귀탈출(EarEscape) - TOP 10 브랜드 50종 이어폰·헤드폰 RAG 추천 및 비교 웹 애플리케이션"

[dependencies]
# Web & Async Runtime
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
tower-http = { version = "0.5", features = ["fs", "trace"] }

# Rust Server-Side Templates (Axum 0.7 호환 — askama_axum 단일 경로)
askama = "0.12"
askama_axum = "0.4"

# Embedded SQLite (외부 C 라이브러리 불필요, FTS5 기본 포함)
rusqlite = { version = "0.32", features = ["bundled"] }

# On-Demand Collector & LLM HTTP Client (OpenSSL 없는 순수 Rust TLS)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
scraper = "0.20"

# Serialization, Async Traits, Errors, Date & Logging
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
